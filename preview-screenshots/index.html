<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticket description — скриншоты</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #111; color: #eee; }

  <figure>

  <figure>
    <figcaption>3. Витрина — checkout desktop</figcaption>
    <img src="./08-ticket-description-storefront-checkout.png" alt="Storefront desktop checkout" />

  <figure>
    <figcaption>4. Вitрина — mobile «Выбрать билеты»</figcaption>
